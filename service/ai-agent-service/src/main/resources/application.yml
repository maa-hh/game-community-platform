server:
  port: 8093

spring:
  application:
    name: ai-agent-service
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DB:game_community}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      database: 0
      timeout: 5000ms
  # Elasticsearch 配置
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9201}
  # Nacos 配置
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yml
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8859}
      eager: true

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.game.community.model.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# AI Agent 配置
ai-agent:
  api-key: ${DASHSCOPE_API_KEY:}
  embedding-endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings
  # 兼容旧配置字段；实际 ChatClient 由 models.default-provider=deepseek 管理。
  chat-endpoint: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}/chat/completions
  embedding-model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v4}
  chat-model: ${DEEPSEEK_CHAT_MODEL:deepseek-flash}
  knowledge-index: ai_knowledge_segment
  retrieval-top-k: 6
  retrieval-candidate-k: 12
  segment-target-length: 420
  segment-overlap: 60
  memory-ttl-hours: 72
  max-rounds: 10
  models:
    default-provider: ${AI_DEFAULT_PROVIDER:deepseek}
    providers:
      deepseek:
        enabled: true
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
        completions-path: /chat/completions
        api-key: ${DEEPSEEK_API_KEY:}
        chat-model: ${DEEPSEEK_CHAT_MODEL:deepseek-flash}
        text-moderation-model: ${DEEPSEEK_TEXT_MODEL:deepseek-flash}
        image-moderation-model: ${DEEPSEEK_IMAGE_MODEL:deepseek-flash}
        temperature: 0.1
      # 可按相同结构增加任意 OpenAI 兼容供应商，并通过 provider 字段选择。
  moderation:
    reject-max-score: ${AUDIT_REJECT_MAX_SCORE:3}
    human-review-max-score: ${AUDIT_HUMAN_REVIEW_MAX_SCORE:6}
    unavailable-decision: ${AUDIT_UNAVAILABLE_DECISION:HUMAN_REVIEW}
    sensitive-words-path: ${AUDIT_SENSITIVE_WORDS_PATH:classpath:moderation/sensitive-words.txt}
    system-prompt-path: ${AUDIT_SYSTEM_PROMPT_PATH:classpath:prompts/moderation-system.st}
    text-prompt-path: ${AUDIT_TEXT_PROMPT_PATH:classpath:prompts/moderation-text-user.st}
    image-prompt-path: ${AUDIT_IMAGE_PROMPT_PATH:classpath:prompts/moderation-image-user.st}
    article-prompt-path: ${AUDIT_ARTICLE_PROMPT_PATH:classpath:prompts/moderation-article-user.st}
    max-text-chars: ${AUDIT_MAX_TEXT_CHARS:12000}
    max-concurrent-model-calls: ${AUDIT_MAX_CONCURRENT_MODEL_CALLS:8}

# 日志配置
logging:
  level:
    com.game.community: debug

# API 文档
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
