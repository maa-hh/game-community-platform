server:
  port: 8093

spring:
  application:
    name: ai-agent-service
  # 统一读取项目根 .env；系统环境变量优先级更高，生产环境仍建议使用外部密钥管理。
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: ${REDIS_COMMAND_TIMEOUT:2000ms}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9093}
    consumer:
      group-id: ai-agent-service-task
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.game.community.model.message
        isolation.level: read_committed
    listener:
      ack-mode: record
      concurrency: ${AI_KAFKA_CONCURRENCY:3}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: ${AI_KAFKA_RETRIES:5}
      properties:
        enable.idempotence: true
  # Nacos 配置
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yml
# AI Agent 配置
ai-agent:
  models:
    default-provider: ${AI_DEFAULT_PROVIDER:deepseek}
    default-embedding-provider: ${AI_DEFAULT_EMBEDDING_PROVIDER:dashscope}
    providers:
      deepseek:
        enabled: true
        protocol: openai-compatible
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
        completions-path: ${DEEPSEEK_COMPLETIONS_PATH:/chat/completions}
        api-key: ${DEEPSEEK_API_KEY:}
        chat-model: ${DEEPSEEK_CHAT_MODEL:deepseek-flash}
        text-moderation-model: ${DEEPSEEK_TEXT_MODEL:deepseek-flash}
        image-moderation-model: ${DEEPSEEK_IMAGE_MODEL:deepseek-flash}
        temperature: 0.1
        requests-per-second: ${DEEPSEEK_REQUESTS_PER_SECOND:20}
        max-concurrent-calls: ${DEEPSEEK_MAX_CONCURRENT_CALLS:8}
        circuit-failure-rate-threshold: ${DEEPSEEK_CIRCUIT_FAILURE_RATE:50}
        circuit-minimum-number-of-calls: ${DEEPSEEK_CIRCUIT_MIN_CALLS:10}
        circuit-sliding-window-size: ${DEEPSEEK_CIRCUIT_WINDOW_SIZE:20}
        circuit-open-seconds: ${DEEPSEEK_CIRCUIT_OPEN_SECONDS:30}
        connect-timeout-ms: ${DEEPSEEK_CONNECT_TIMEOUT_MS:2000}
        read-timeout-ms: ${DEEPSEEK_READ_TIMEOUT_MS:10000}
      dashscope:
        enabled: true
        protocol: openai-compatible
        base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
        completions-path: ${DASHSCOPE_COMPLETIONS_PATH:/v1/chat/completions}
        embeddings-path: ${DASHSCOPE_EMBEDDINGS_PATH:/v1/embeddings}
        api-key: ${DASHSCOPE_API_KEY:}
        chat-model: ${DASHSCOPE_CHAT_MODEL:qwen-plus}
        embedding-model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v4}
        text-moderation-model: ${DASHSCOPE_TEXT_MODEL:qwen-plus}
        image-moderation-model: ${DASHSCOPE_IMAGE_MODEL:qwen-plus}
        temperature: 0.1
        requests-per-second: ${DASHSCOPE_REQUESTS_PER_SECOND:20}
        max-concurrent-calls: ${DASHSCOPE_MAX_CONCURRENT_CALLS:8}
        circuit-failure-rate-threshold: ${DASHSCOPE_CIRCUIT_FAILURE_RATE:50}
        circuit-minimum-number-of-calls: ${DASHSCOPE_CIRCUIT_MIN_CALLS:10}
        circuit-sliding-window-size: ${DASHSCOPE_CIRCUIT_WINDOW_SIZE:20}
        circuit-open-seconds: ${DASHSCOPE_CIRCUIT_OPEN_SECONDS:30}
        connect-timeout-ms: ${DASHSCOPE_CONNECT_TIMEOUT_MS:2000}
        read-timeout-ms: ${DASHSCOPE_READ_TIMEOUT_MS:10000}
      # 可按相同结构增加任意 OpenAI 兼容供应商，并通过 provider 字段选择。
  moderation:
    reject-max-score: ${AUDIT_REJECT_MAX_SCORE:3}
    human-review-max-score: ${AUDIT_HUMAN_REVIEW_MAX_SCORE:6}
    unavailable-decision: ${AUDIT_UNAVAILABLE_DECISION:HUMAN_REVIEW}
    sensitive-words-path: ${AUDIT_SENSITIVE_WORDS_PATH:classpath:moderation/sensitive-words.txt}
    system-prompt-path: ${AUDIT_SYSTEM_PROMPT_PATH:classpath:prompts/moderation-system.st}
    text-prompt-path: ${AUDIT_TEXT_PROMPT_PATH:classpath:prompts/moderation-text-user.st}
    image-prompt-path: ${AUDIT_IMAGE_PROMPT_PATH:classpath:prompts/moderation-image-user.st}
    article-prompt-path: ${AUDIT_ARTICLE_PROMPT_PATH:classpath:prompts/moderation-article-user.st}
    max-text-chars: ${AUDIT_MAX_TEXT_CHARS:12000}
    max-concurrent-model-calls: ${AUDIT_MAX_CONCURRENT_MODEL_CALLS:8}
    global-max-concurrent-model-calls: ${AUDIT_GLOBAL_MAX_CONCURRENT_MODEL_CALLS:32}
    global-permit-lease-seconds: ${AUDIT_GLOBAL_PERMIT_LEASE_SECONDS:120}
    max-image-bytes: ${AUDIT_MAX_IMAGE_BYTES:5242880}
    max-article-images: ${AUDIT_MAX_ARTICLE_IMAGES:9}
    allow-remote-image-urls: ${AUDIT_ALLOW_REMOTE_IMAGE_URLS:true}
    allowed-image-hosts: ${AUDIT_ALLOWED_IMAGE_HOSTS:game-resource1.3q.hair,cdn.akamai.steamstatic.com,shared.akamai.steamstatic.com,steamcdn-a.akamaihd.net,steamuserimages-a.akamaihd.net,images.steamusercontent.com}
  search:
    search-terms-system-prompt-path: ${AI_SEARCH_TERMS_SYSTEM_PROMPT_PATH:classpath:prompts/search-terms-system.st}
  kafka:
    result-send-timeout-ms: ${AI_KAFKA_RESULT_SEND_TIMEOUT_MS:5000}

# 日志配置
logging:
  level:
    com.game.community: ${AI_LOG_LEVEL:INFO}

# API 文档
springdoc:
  api-docs:
    enabled: ${AI_SPRINGDOC_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${AI_SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: ${AI_MANAGEMENT_EXPOSURE:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: ${AI_HEALTH_DETAILS:never}
