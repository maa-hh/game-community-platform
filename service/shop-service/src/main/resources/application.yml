server:
  port: 8085

gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET}

spring:
  application:
    name: shop-service
  # shop-service 不使用 AI，排除传递依赖带来的 DashScope 自动配置
  autoconfigure:
    exclude:
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAgentAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioSpeechAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioTranscriptionAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeEmbeddingAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeImageAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeRerankAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeVideoAutoConfiguration
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DB:game_community}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 不提供开发环境之外的默认账号密码，避免误把 root/root123 带入部署环境。
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: ${SHOP_DB_MAX_POOL_SIZE:30}
      minimum-idle: ${SHOP_DB_MIN_IDLE:5}
      connection-timeout: 3000
      validation-timeout: 1000
  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      database: 0
      timeout: 5000ms
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9093}
    consumer:
      group-id: ${SHOP_KAFKA_CONSUMER_GROUP:shop-delivery-recovery}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.game.community.model.message
        spring.json.value.default.type: com.game.community.model.message.ShopOrderPaidMessage
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 120000
  # Nacos 配置
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yml
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8859}
      eager: true
    openfeign:
      client:
        config:
          user-service:
            connectTimeout: ${SHOP_USER_FEIGN_CONNECT_TIMEOUT_MS:1000}
            readTimeout: ${SHOP_USER_FEIGN_READ_TIMEOUT_MS:3000}
            loggerLevel: basic
# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.game.community.model.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 日志配置
logging:
  level:
    com.game.community: info

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

shop:
  order:
    create-poll-ms: ${SHOP_ORDER_CREATE_POLL_MS:500}
    expire-poll-ms: ${SHOP_ORDER_EXPIRE_POLL_MS:5000}
  delivery:
    poll-ms: ${SHOP_DELIVERY_POLL_MS:500}
  kafka:
    outbox-poll-ms: ${SHOP_KAFKA_OUTBOX_POLL_MS:500}

# 生产环境建议将订单修复/对账任务交给 XXL-JOB Admin 调度；本地保留 Scheduled 轮询作为兜底。
xxl:
  job:
    admin-addresses: ${XXL_JOB_ADMIN_ADDRESS:http://localhost:8088/xxl-job-admin}
    access-token: ${XXL_JOB_ACCESS_TOKEN:}
    appname: shop-service
    port: ${XXL_JOB_PORT:9998}
    log-path: logs/xxl-job/shop-service
    log-retention-days: 30
