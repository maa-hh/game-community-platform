server:
  port: 8082

spring:
  application:
    name: content-service
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DB:game_community}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:1000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
  # 文件上传配置
  servlet:
    multipart:
      # 图片 ≤5MB；媒体分片默认 5MiB/片，单个请求仍受 6MB 限制
      max-file-size: 6MB
      max-request-size: 32MB
  # MongoDB 配置
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27018/game_community?connectTimeoutMS=3000&serverSelectionTimeoutMS=3000&socketTimeoutMS=15000&maxPoolSize=100&minPoolSize=10&waitQueueTimeoutMS=3000}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      database: 0
      timeout: ${REDIS_COMMAND_TIMEOUT:3000ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2000ms}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:64}
          max-idle: ${REDIS_POOL_MAX_IDLE:16}
          min-idle: ${REDIS_POOL_MIN_IDLE:4}
          max-wait: ${REDIS_POOL_MAX_WAIT:2000ms}
  # Nacos 配置
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yml
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8859}
      eager: true
    openfeign:
      circuitbreaker:
        enabled: true
        alphanumeric-ids:
          enabled: true
      client:
        config:
          default:
            connectTimeout: ${FEIGN_CONNECT_TIMEOUT_MS:2000}
            readTimeout: ${FEIGN_READ_TIMEOUT_MS:5000}
            loggerLevel: basic
  # Kafka 配置
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9093}
    consumer:
      group-id: content-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      enable-auto-commit: false
      properties:
        request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT_MS:5000}
        session.timeout.ms: ${KAFKA_SESSION_TIMEOUT_MS:15000}
        max.poll.interval.ms: ${KAFKA_MAX_POLL_INTERVAL_MS:300000}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: ${KAFKA_RETRIES:5}
      properties:
        enable.idempotence: true
        delivery.timeout.ms: ${KAFKA_DELIVERY_TIMEOUT_MS:30000}
        request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT_MS:5000}
        max.in.flight.requests.per.connection: 5

feign:
  sentinel:
    enabled: true

# AI Feign 远程调用熔断：失败时由共享 fallback 转人工审核，禁止误放行。
resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: false
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
    instances:
      aiAgentFeignClientmoderate:
        base-config: default

# MinIO 配置
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin123}
  public-bucket-name: ${MINIO_PUBLIC_BUCKET:game-community-public}
  private-bucket-name: ${MINIO_PRIVATE_BUCKET:game-community-private}
  public-file-prefix: ${MINIO_PUBLIC_FILE_PREFIX:user-files/public}
  private-file-prefix: ${MINIO_PRIVATE_FILE_PREFIX:user-files/pending}
  presigned-expire-seconds: ${MINIO_PRESIGNED_EXPIRE_SECONDS:900}
  max-read-bytes: ${MINIO_MAX_READ_BYTES:16777216}
  max-hash-bytes: ${MINIO_MAX_HASH_BYTES:0}
  max-requests: ${MINIO_MAX_REQUESTS:64}
  max-requests-per-host: ${MINIO_MAX_REQUESTS_PER_HOST:16}
  max-idle-connections: ${MINIO_MAX_IDLE_CONNECTIONS:32}
  keep-alive-minutes: ${MINIO_KEEP_ALIVE_MINUTES:5}

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.game.community.model.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# 日志配置
logging:
  level:
    com.game.community: ${CONTENT_LOG_LEVEL:info}

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

content:
  file-upload:
    concurrency: ${CONTENT_FILE_UPLOAD_CONCURRENCY:8}
    # 分片写 MinIO 的单实例并发上限和等待队列；多实例总并发为实例数 × 此上限
    chunk-concurrency: ${CONTENT_CHUNK_UPLOAD_CONCURRENCY:8}
    chunk-queue-capacity: ${CONTENT_CHUNK_UPLOAD_QUEUE_CAPACITY:64}
  outbox:
    poll-interval-ms: ${CONTENT_OUTBOX_POLL_INTERVAL_MS:1000}

social:
  internal-token: ${SOCIAL_INTERNAL_TOKEN:}

# OG 分享落地页
share:
  frontend-base-url: ${SHARE_FRONTEND_BASE_URL:http://localhost:3000}
  share-base-url: ${SHARE_BASE_URL:http://localhost:8080}
  site-name: ${SHARE_SITE_NAME:游戏社区}
  default-image-url: ${SHARE_DEFAULT_IMAGE_URL:}
