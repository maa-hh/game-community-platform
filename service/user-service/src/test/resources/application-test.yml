spring:
  application:
    name: user-service-test
  ai:
    dashscope:
      api-key: test-key
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:user_service;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    sentinel:
      enabled: false
  data:
    redis:
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: localhost:9093
    consumer:
      auto-startup: false
    listener:
      auto-startup: false

minio:
  endpoint: http://localhost:9000
  public-endpoint: http://localhost:9000
  accessKey: minioadmin
  secretKey: minioadmin123
  public-bucket-name: game-community-public
  private-bucket-name: game-community-private
  public-file-prefix: user-files/public
  private-file-prefix: user-files/pending
  presigned-expire-seconds: 900

email:
  validation:
    mx-check-enabled: false
  code:
    expire-seconds: 300
  mock:
    enabled: true
    addresses: "*"
    fixed-code: "123456"
  force-real: false

auth:
  seed:
    enabled: false

audit:
  mode: mock
  async:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 200
    keep-alive-seconds: 60
    thread-name-prefix: audit-
  dashscope:
    text-model:
    image-model:
    fail-open-on-unavailable: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
