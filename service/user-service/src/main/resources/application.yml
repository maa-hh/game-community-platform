server:
  port: 8081

gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET}

spring:
  application:
    name: user-service
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:5MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:6MB}
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DB:game_community}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      database: 0
      timeout: 5000ms
  # Nacos 配置
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yml
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8859}
      eager: true
  # Kafka 配置
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9093}
    consumer:
      group-id: user-consumer-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: ${USER_KAFKA_RETRIES:5}
      properties:
        enable.idempotence: true

# MinIO 配置
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin123}
  public-bucket-name: ${MINIO_PUBLIC_BUCKET:game-community-public}
  private-bucket-name: ${MINIO_PRIVATE_BUCKET:game-community-private}
  public-file-prefix: ${MINIO_PUBLIC_FILE_PREFIX:user-files/public}
  private-file-prefix: ${MINIO_PRIVATE_FILE_PREFIX:user-files/pending}
  presigned-expire-seconds: ${MINIO_PRESIGNED_EXPIRE_SECONDS:900}
  max-requests: ${MINIO_MAX_REQUESTS:64}
  max-requests-per-host: ${MINIO_MAX_REQUESTS_PER_HOST:16}
  max-idle-connections: ${MINIO_MAX_IDLE_CONNECTIONS:32}
  keep-alive-minutes: ${MINIO_KEEP_ALIVE_MINUTES:5}

# 审核任务配置；实际模型调用统一由 ai-agent-service 完成。
audit:
  mode: ${AUDIT_MODE:llm}
  async:
    core-pool-size: ${AUDIT_ASYNC_CORE_POOL_SIZE:2}
    max-pool-size: ${AUDIT_ASYNC_MAX_POOL_SIZE:4}
    queue-capacity: ${AUDIT_ASYNC_QUEUE_CAPACITY:200}
    keep-alive-seconds: ${AUDIT_ASYNC_KEEP_ALIVE_SECONDS:60}
    thread-name-prefix: ${AUDIT_ASYNC_THREAD_NAME_PREFIX:audit-}
  # 多实例共享数据库任务表；每个实例周期拉取，任务执行前用状态 CAS 防重复消费。
  recovery:
    initial-delay-ms: ${AUDIT_RECOVERY_INITIAL_DELAY_MS:10000}
    fixed-delay-ms: ${AUDIT_RECOVERY_FIXED_DELAY_MS:30000}
# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.game.community.model.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# 日志配置
logging:
  level:
    com.game.community: debug

# 邮箱验证码（真实 SMTP 发信，见下方配置说明）
email:
  validation:
    mx-check-enabled: ${EMAIL_MX_CHECK_ENABLED:true}
  code:
    # 验证码有效期（秒）：Redis TTL、接口 expireIn、邮件文案共用
    expire-seconds: ${EMAIL_CODE_EXPIRE_SECONDS:300}
  mock:
    enabled: ${EMAIL_MOCK_ENABLED:false}
    addresses: ${EMAIL_MOCK_ADDRESSES:}
    fixed-code: ${EMAIL_MOCK_FIXED_CODE:123456}
  force-real: ${EMAIL_FORCE_REAL:false}
  smtp:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:}
    starttls: ${SMTP_STARTTLS:true}
  # 发信线程池：控流 + 有界队列；发送失败只记录日志，不自动重试
  async:
    core-pool-size: ${EMAIL_ASYNC_CORE_POOL_SIZE:2}
    max-pool-size: ${EMAIL_ASYNC_MAX_POOL_SIZE:4}
    queue-capacity: ${EMAIL_ASYNC_QUEUE_CAPACITY:100}
    keep-alive-seconds: ${EMAIL_ASYNC_KEEP_ALIVE_SECONDS:60}
    thread-name-prefix: ${EMAIL_ASYNC_THREAD_NAME_PREFIX:email-}

# 开发环境可选：预置测试账号 test@game.com / abc123（生产 profile 默认关闭）
auth:
  seed:
    enabled: ${AUTH_SEED_ENABLED:false}
    email: ${AUTH_SEED_EMAIL:test@game.com}
    password: ${AUTH_SEED_PASSWORD:abc123}
    nickname: ${AUTH_SEED_NICKNAME:游戏达人}
  cookie:
    secure: ${AUTH_COOKIE_SECURE:false}

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
