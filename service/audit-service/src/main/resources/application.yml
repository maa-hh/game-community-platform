server:
  port: 8091

spring:
  application:
    name: audit-service
  # utils 作为共享基础模块会传递 Mongo/Redis 客户端，但审核服务不使用它们。
  # 显式排除自动配置，避免无关连接与健康检查影响多实例就绪状态。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DB:game_community}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
  # Nacos 配置
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yml
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8859}
      eager: true
    openfeign:
      client:
        config:
          default:
            connect-timeout: ${AUDIT_FEIGN_CONNECT_TIMEOUT:1000}
            read-timeout: ${AUDIT_FEIGN_READ_TIMEOUT:3000}
          content-service:
            # 人工通过帖子时可能同步搬运待审媒体，不能使用通用的短超时。
            connect-timeout: ${AUDIT_CONTENT_FEIGN_CONNECT_TIMEOUT:1000}
            read-timeout: ${AUDIT_CONTENT_FEIGN_READ_TIMEOUT:10000}
  # Kafka 配置
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9093}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: ${AUDIT_KAFKA_MAX_POLL_RECORDS:100}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.game.community.model.message
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: ${AUDIT_KAFKA_RETRIES:5}
      properties:
        enable.idempotence: true
    listener:
      concurrency: ${AUDIT_KAFKA_CONCURRENCY:3}
      ack-mode: record

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.game.community.model.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 日志配置
logging:
  level:
    com.game.community: ${AUDIT_LOG_LEVEL:INFO}

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

audit:
  notification-outbox:
    # 必须大于 Kafka producer 的最大投递时长，避免慢投递被多实例重复认领。
    lock-timeout-ms: ${AUDIT_NOTIFICATION_OUTBOX_LOCK_TIMEOUT_MS:600000}
    poll-interval-ms: ${AUDIT_NOTIFICATION_OUTBOX_POLL_INTERVAL_MS:500}
    batch-size: ${AUDIT_NOTIFICATION_OUTBOX_BATCH_SIZE:100}
