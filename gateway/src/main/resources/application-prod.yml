server:
  forward-headers-strategy: native

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:https://game.3s.tunnelfrp.com,https://game.viphk.nnhk.cc}
            allowed-methods: GET,POST,PUT,DELETE,OPTIONS
            allowed-headers: '*'
            allow-credentials: true
            max-age: 3600

logging:
  level:
    root: INFO
    com.game.community: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
