server:
  port: 8080

spring:
  application:
    name: gateway

# AI 配置
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      database: 0
      timeout: 5000ms
  # Nacos 配置
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
      config:
        enabled: false
        import-check:
          enabled: false
    # Gateway 路由配置
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: danmaku-websocket-service
          uri: lb:ws://danmaku-service
          predicates:
            - Path=/danmaku/ws/**
        - id: danmaku-service
          uri: lb://danmaku-service
          predicates:
            - Path=/danmaku/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user/**
        - id: steam-service
          uri: lb://steam-service
          predicates:
            - Path=/steam/**,/game/**
        - id: content-service
          uri: lb://content-service
          predicates:
            - Path=/article/**,/category/**,/file/**,/share/post/**
        - id: social-service
          uri: lb://social-service
          predicates:
            - Path=/social/**,/report/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notification/**
        - id: shop-service
          uri: lb://shop-service
          predicates:
            - Path=/shop/**
        - id: recommend-service
          uri: lb://recommend-service
          predicates:
            - Path=/hot-article/**,/api/**
        - id: search-service
          uri: lb://search-service
          predicates:
            - Path=/search/**
        - id: ai-agent-service
          uri: lb://ai-agent-service
          predicates:
            - Path=/ai/**
        - id: audit-service
          uri: lb://audit-service
          predicates:
            - Path=/audit/**
      # CORS 配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
            allowed-methods: '*'
            allowed-headers: '*'
            allow-credentials: true
            max-age: 3600
    # Sentinel 配置
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8859}
      eager: true

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

# Gateway Sentinel 限流配置
gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET}
  auth:
    # 认证公开路径文档；实际前缀匹配在 JwtGlobalFilter 和 GatewayConstants.AUTH_PUBLIC_PATH_PREFIXES
    public-paths:
      - /user/auth/send-code
      - /user/auth/register
      - /user/auth/login
      - /user/auth/refresh
      - /user/auth/reset-password
      - /user/auth/logout
  sentinel:
    user-service-qps: 50
    steam-service-qps: 100
    shop-service-qps: 200
    # 模型审核属于高成本外部调用，先在网关入口设置独立限流。
    ai-agent-service-qps: ${AI_AGENT_SERVICE_QPS:20}
    user-service-degrade-exception-ratio: 0.5
    user-service-degrade-slow-rt-ms: 3000
    user-service-degrade-slow-ratio: 0.6
    user-service-degrade-min-request-amount: 20
    user-service-degrade-stat-interval-ms: 10000
    user-service-degrade-time-window-seconds: 10
